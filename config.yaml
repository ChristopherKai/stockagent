# 自选股研究系统配置。API key、webhook 等敏感信息写在 .env，不要写在这里。

data_dir: data                      # 数据库、文档、简报的存放位置

# ------------------------------------------------------------------ LLM
# 每个 profile 是一个模型端点：
#   protocol: anthropic → 官方 Anthropic SDK（Claude）；base_url 可改成中转地址
#   protocol: openai    → OpenAI 兼容接口（DeepSeek、通义千问、Kimi、OpenRouter、Ollama、vLLM 等）
#   protocol: mock      → 离线模拟，不调用任何模型（演练流程用）
# tasks 决定每个环节用哪个 profile；换模型只需改这里。配置后用 `stock llm-test` 验证。
llm:
  default_profile: free
  concurrency: 4
  max_continuations: 3                      # 文本输出达到 max_tokens 时，自动让模型从中断处续写的次数
  profiles:
    local:                                  # 本地 LLM 网关（127.0.0.1:18080），key 在 .env
      protocol: openai
      base_url: http://127.0.0.1:18080/v1
      model: cn:deepseek-v4-flash
      api_key_env: LOCAL_LLM_API_KEY
      json_mode: true
      tool_mode: native                     # 该接口支持原生工具调用；不支持的服务改为 text
      max_tokens: 32000                     # 单次输出上限（实测该模型可用 32000）；超出时会自动续写
      # max_input_chars: 60000              # 单次最多送入的资料字数；不填 = 不限制（只受 report.profile_max_doc_chars 控制）
      timeout: 900
      fallback: qwen                        # 本模型不可用（上游未启动、账号池繁忙、限流等）时自动改用

    deepseek:                               # 同一网关上的 DeepSeek v4.1 flash（1M 上下文，经 OpenRouter，需账户有余额）
      protocol: openai
      base_url: http://127.0.0.1:18080/v1
      model: anthropic/deepseek/deepseek-v4.1-flash[1m]
      api_key_env: LOCAL_LLM_API_KEY
      json_mode: true
      tool_mode: native
      max_tokens: 16000
      timeout: 900

    qwen:                                   # 同一网关上的本地 Qwen 3.8 27B（MLX，不依赖外部额度，作为备用）
      protocol: openai
      base_url: http://127.0.0.1:18080/v1
      model: qwen3.8-27b-splash
      api_key_env: LOCAL_LLM_API_KEY
      json_mode: true
      tool_mode: native
      max_tokens: 16000
      timeout: 900

    claude:
      protocol: anthropic
      base_url: https://api.anthropic.com   # 用中转站时改成中转地址
      model: claude-opus-5                  # 可选：claude-opus-5-5、claude-sonnet-5、claude-haiku-4-5
      api_key_env: ANTHROPIC_API_KEY        # 从 .env 读取
      auth: api_key                         # 中转站要求 "Authorization: Bearer" 时改为 bearer
      effort: high                          # low | medium | high | xhigh | max
      thinking: adaptive                    # adaptive | off（claude-haiku-4-5 需设为 off 并删掉 effort）
      structured_output: true               # 中转站不支持 output_config 时改为 false（改用提示词约束 JSON）
      refusal_fallback: true                # 官方 API 的拒答自动回退（beta）；中转站不支持时改为 false
      max_tokens: 32000

    # deepseek:
    #   protocol: openai
    #   base_url: https://api.deepseek.com
    #   model: deepseek-chat
    #   api_key_env: DEEPSEEK_API_KEY
    #   json_mode: true
    #   max_tokens: 8000

    # qwen:
    #   protocol: openai
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   model: qwen-max
    #   api_key_env: DASHSCOPE_API_KEY
    #   max_tokens: 8000

    # ollama:                               # 其他本地模型服务（Ollama / vLLM）
    #   protocol: openai
    #   base_url: http://localhost:11434/v1
    #   model: qwen2.5:32b
    #   json_mode: false
    #   tool_mode: text
    #   max_tokens: 8000

    mock:
      protocol: mock
      model: mock

    free:
      protocol: openai
      base_url: http://127.0.0.1:18080/v1
      model: global:deepseek-v4.1-flash
      api_key_env: CCLOAD_KEY
      max_tokens: 128000
      effort: high
      fallback: local
    deepseek-v4-pro:
      protocol: openai
      base_url: http://127.0.0.1:18080/v1
      model: cn:deepseek-v4-pro
      api_key_env: CCLOAD_KEY
  tasks:
    triage: {profile: free, max_tokens: 48000}    # 事件分级、共享账号分流（推理模型光思考就要约 16000，预算给足省掉一次白跑）
    stock_brief: free       # 个股研判
    market_brief: free      # 今日要点
    profile: free           # 公司画像（读年报，输入很长）
    research: free            # 深度报告：带工具的研究 agent
    dossier: free            # 深度报告：撰写与跟踪卡
    monitor: {profile: free, max_tokens: 32000}   # 事件类证伪条件检查（同上）
    tracker: free           # 标的追踪：按新事件修正估值假设（带工具的 agent + 结构化修正）
    chat: free              # 报告研读对话：WebUI 报告页讲解深度报告（带工具的 agent）

# ------------------------------------------------------------------ 数据源
sources:
  announcements_lookback_days: 90   # 首次运行回溯多少天的公告
  news_lookback_days: 30
  price_history_days: 400
  price_sources: [eastmoney, tencent, sina, yahoo]   # 行情源顺序：前一个失败自动切换到下一个
  request_delay: 0.6                # 同一网站两次请求的最小间隔（秒）；太小会被东方财富断开
  eastmoney_news: true
  eastmoney_news_page_size: 20
  google_news: true                 # 在中国大陆需要能访问 Google，否则改为 false
  google_news_locales: [zh-CN, zh-HK, en-US]
  google_news_max_per_query: 40     # 每个检索词最多保留最新的多少条
  google_news_resolve_max: 30       # 每家公司每次最多读多少条新条目的原文页，取真实发布时间（Google 给的是收录时间；0=不读）
  plan_keywords_max: 6              # 深度报告给出的产业链跟踪词，每次最多检索几个
  blocked_news_sources: [TradingView]
  blocked_title_patterns: []        # 正则，匹配到的新闻标题直接丢弃
  auto_download_reports: true       # 自动下载最新年报/中期报告（A+H 公司优先巨潮简体全文）
  # 腾讯 ima 知识库（.env 填 IMA_CLIENT_ID / IMA_API_KEY；stock ima list 查看可访问的知识库）。
  # 每次抓取按公司名、代码、英文名检索标题，新出现的条目进入分级：研报等 PDF 原文入库为资料，新闻截图用本地 tesseract OCR。
  # 研究 agent 另有 ima_search / ima_read 工具。目录浏览接口有每日次数上限，所以只用检索。
  ima:
    enabled: true
    knowledge_bases: [【爱分享】的财经资讯]
    queries_per_company: 4          # 每家公司每次几个检索词（每个词最多返回约 100 条，取并集）
    download: true                  # 下载新条目原文
    ocr: true
    max_download_mb: 40
    max_downloads_per_day: 25       # ima 对取原文有未公开的每日上限（实测约几十次），agent 的 ima_read 也计入
    in_alert: false                 # 盘中 stock alert 是否也检索（默认只在 stock run 时）
  # 推特 / X（经 agent-reach 的 twitter-cli；.env 填 TWITTER_AUTH_TOKEN / TWITTER_CT0，或用 `agent-reach configure twitter-cookies` 保存的 Cookie）。
  # 两个开关互相独立，WebUI「设置 → 通用 → 推特 / X」可改：
  #   agent_tools：研究 agent 与标的追踪可按需调用 twitter_search / twitter_user；
  #   news_feed：stock run 时自动抓取公司的推特账号（watchlist 的 twitter_official / twitter_accounts）与检索词，新帖子进入事件分级。
  # 你登记的账号（共享账号、公司的官方号、媒体 / 快讯 / 关键人物账号）按已证实的消息处理；公司名 / 跟踪词检索到的任意作者是未经证实，分级后重要性由代码封顶 feed_max_materiality。
  twitter:
    agent_tools: true
    news_feed: true
    max_results: 20                 # agent 单次工具调用最多返回几条
    days: 7                         # twitter_search 默认只看最近几天
    min_likes: 3                    # twitter_search 默认的最低点赞数（过滤 0 互动的刷屏）
    shared_accounts: [DeItaone, wallstengine, FirstSquawk]   # 新闻源：全局共享账号（财经快讯号等）；帖子不做关键词匹配：连同全部自选股简介批量分流（每 20 条一次调用），只有分到的公司才分级
    shared_max_per_account: 100     # 新闻源：共享账号每次读取最近几条（最多 200）；快讯号发帖很密，读少了会漏
    shared_route_max: 6             # 新闻源：一条共享账号帖子最多分给几家公司
    discover: true                  # 账号发现：新闻源检索时记下反复出现的作者，设置页列为候选账号，由你决定是否加入
    discover_days: 30
    discover_min_posts: 2
    feed_plan_keywords: 2           # 新闻源：每家公司用深度报告跟踪计划里的前几个新闻跟踪词的英文译文检索（只看英文帖子；0 = 不用）
    feed_plan_keywords_zh: 1        # 新闻源：再用前几个跟踪词的中文原词检索（只看中文帖子；0 = 不用）
    feed_max_calls: 40              # 新闻源：每次运行最多调用推特几次（读账号 + 检索；0 = 不限），超出的公司留到下次、轮流覆盖；X 对检索约 15 分钟 50 次，超了会 429
    feed_queries_per_company: 3     # 新闻源：公司英文叫法（美股代号 $XPEV、英文名）最多几个，并成一条 OR 检索式（只看英文帖子）
    feed_chinese_name: true         # 新闻源：再用中文公司名检索一次（只看中文帖子）：英文优先、适当用中文
    feed_scope: all                 # 新闻源覆盖的公司：all 全部自选股 / tracked 只有标的追踪中的公司
    feed_min_likes: 10              # 新闻源：最低点赞数
    feed_max_per_query: 10          # 新闻源：每个检索词 / 账号最多取几条
    feed_languages: [en, zh]        # 新闻源：只收录这些语种的帖子（推特 lang 代码；留空 = 不限）
    feed_max_materiality: 2         # 未经证实的推特帖子（公司名 / 跟踪词检索的任意作者）分级后重要性的上限（1–5）；登记账号不封顶
  sec_user_agent: "your.email@example.com"   # 跟踪美股时必填，格式 "姓名 邮箱"（SEC 要求）；美股公告与 XBRL 报表（statements 工具）都要用
  ccass: true                       # 每天记录自选港股的 CCASS（中央结算系统）持股快照（港交所，T+1 可查）
  ccass_alert_pct: 1.0              # 相邻两份快照间某参与者持股变化 ≥ 此值（占已发行股份的百分点）时，生成一条数据异动进入分级
  ccass_keep: 60                    # 每份快照保存持股最多的前几名参与者
  holdchg: true                     # 大股东 / 董监高持股变动：港股取港交所权益披露（DI），美股取 Form 4 与 13D/13G；stock run 时抓取，达到阈值的变动进入分级（盘中 alert 不抓）
  holdchg_lookback_days: 30         # 第一次抓取回溯天数；之后按水位增量（每次再重叠 5 天，申报常晚几天才公布）
  holdchg_hk_min_pct: 0.5           # 港股：大股东 / 董事的净买卖累计（占已发行股份的百分点，只算明确的买入 / 获配 / 卖出 / 配售）达到它才生成事件
  holdchg_hk_streak: 5              # 港股：同一申报人连续这么多份同方向买入 / 卖出申报，净额达到上面阈值的一半就生成事件（控股股东每天小额增持）
  holdchg_hk_insider_value: 1000000 # 港股：董事 / 最高行政人员一次买卖（同方向合并）金额 ≥ 此值（港元）也生成事件，不看比例
  holdchg_us_insider_value: 500000  # 美股：内部人公开市场买卖（Form 4）金额 ≥ 此值（美元）才生成事件；期权行权、授予、税款代扣不算
  holdchg_us_filer_pct: 1.0         # 美股：13G 申报人的持股比例较上次变化 ≥ 此值（百分点）或降到 5% 以下才生成事件；13D 与首次 13G 一律生成

# ------------------------------------------------------------------ 研究 agent（深度报告）
  sec_forms:
    - 8-K
    - 10-Q
    - 10-K
    - 6-K
    - 20-F
    - S-1
    - S-3
    - 424B4
    - 424B5
    - SC 13D
    - SC 13G
    - SC 13D/A
    - SC 13G/A
    - DEF 14A
agent:
  max_steps: 20                     # 每个研究子任务最多调用工具的轮数
  valuation_extra_steps: 8          # 估值情景子任务（读完前序笔记后建模）在 max_steps 之上多给的轮数
  gap_agents: 3                     # 补缺检索最多同时跑几个 agent（缺口分组并行）；1 = 不并行
  tool_result_chars: 4000           # 单次工具结果最多返回给模型的字数
  # 网页搜索源。搜索 API 排在最前：exa（经 agent-reach 配置的 mcporter 调用，本机装了就启用）、
  # bocha 博查 / tavily / serper（.env 填了 key 才启用）；免费源中前三个轮流使用，其余在它们都失败时备用
  web_search: [exa, bocha, tavily, serper, so360, toutiao, gnews, baidu, bing, duckduckgo]
  parallel_sections: true           # 研究子任务并行（模型服务支持并发时开启）

# ------------------------------------------------------------------ 标的追踪（stock target；stock run 每次都会执行）
# 以深度报告的估值矩阵为基线（代码重建，不调用 LLM），按新事件修正驱动指标、倍数、情景概率、股本、净现金；
# 目标价（情景加权估值）始终由代码按修正后的假设计算，不采用模型给出的数字。
tracker:
  min_materiality: 3                # 触发修正的最低事件重要性（1–5）
  max_events: 25                    # 每次修正最多处理的依据条数，其余留到下次
  max_steps: 8                      # 修正 agent 最多调用工具的轮数
  web_search: true                  # 修正 agent 可用网页搜索（深度报告运行期间自动暂停，避免争抢搜索源）
  target: expected                  # 目标价口径：expected 概率加权 / base 基准情景
  notify_min_change: 0.05           # 目标价变动达到 5% 时推送（stock run --push 时并入日报）
  flag_change: 0.25                 # 单项假设变动超过 25% 时标注「大幅修正」
  auto_rebaseline: true             # 有新的深度报告时自动重建估值基线
  redo_materiality: 5               # 重要性 5 的事件被判为实质影响时，自动排队重跑深度报告（由 stock web 执行）
  redo_on_broken: true              # 论点被判失效时自动排队重跑深度报告
  redo_cooldown_days: 3             # 同一公司自动重跑深度报告的冷却天数

# ------------------------------------------------------------------ 报告研读对话（WebUI 报告页右侧；只讲解报告，不改结论，不作为追踪修正的依据）
chat:
  web_search: true                  # 可用网页搜索（深度报告运行期间自动暂停，避免争抢搜索源）
  max_steps: 8                      # 每次回答最多调用工具的轮数
  max_turns: 20                     # 追问时带上最近多少轮问答（另受 profile 的 max_input_chars 限制）

# ------------------------------------------------------------------ 选股器（stock screen：港股通 + A 股全市场初筛；研究候选，不是买卖建议）
screen:
  markets: [HK, A]
  hk_scope: all                     # 港股范围：all 全部港股（含非港股通、创业板）| connect 只看港股通；运行时可用 --hk-scope 或选股页的「港股范围」临时改
  refresh_days: 6                   # 报表缓存多少天后重抓（已披露一年以上的报告期只抓一次）
  min_mcap: {HK: 2.0e+9, A: 3.0e+9} # 总市值下限（港元 / 人民币）
  min_avg_amount: {HK: 1.0e+7, A: 3.0e+7}   # 20 日成交额中位数下限（港元 / 人民币）
  participation: 0.1                # 可容纳资金 ≈ 成交额中位数 × 10% × 5 天（只作参考，不参与过滤）
  min_listing_days: 365
  # 桶 1 现金地板：保守 FCF Yield（TTM 与 3 年平均取低）≥ 8%，或净现金 ≥ 市值 50%，或 Negative EV
  min_fcf_yield: 0.08
  min_net_cash_ratio: 0.5
  # 粗算赔率 = (合理价值 − 现价) ÷ (现价 − 地板)，只用于排序和分层；深研后以深度报告的情景估值为准
  fair_fcf_yield: 0.08              # 合理价值 = 保守 FCF ÷ 8% + 净现金
  bear_fcf_yield: 0.2               # 地板 = 最差一期 FCF ÷ 20% + 净现金 × 70%（净负债全额扣减）
  cash_haircut: 0.3                 # 现金打七折：现金可能滞留子公司、不分配
  min_downside: 0.15                # 下行至少按 15% 计（地板高于现价时也有市场风险）
  # 分层：A 高胜率 + 高赔率 / B 高胜率 / C 高赔率 / D 观察
  odds_a: 3.0                       # A 类：赔率 ≥ 3、下行 ≤ 20%、有催化剂、无严重风险标记
  max_downside_a: 0.2
  odds_win: 1.0                     # B 类：质量红利入选或「催化剂 + 下行 ≤ 20%」，赔率 ≥ 1
  odds_b: 3.0                       # C 类：赔率 ≥ 3，但胜率证据（地板、催化剂、稳定现金流）不足
  event_odds_a: 2.0                 # 事件池的 A 类赔率门槛
  # 质量红利桶（高胜率）：近 3 年 FCF 都为正且稳定、连续派息 ≥ 3 年、股息率 ≥ 4% 且被 FCF 覆盖、保守 FCF Yield ≥ 5%
  quality_min_dividend_yield: 0.04
  quality_min_div_years: 3
  quality_fcf_stability: 0.4
  quality_min_fcf_yield: 0.05
  top_n: 40                         # 每个策略桶进入候选的数量
  quick_top_n: 15                   # 每个池送模型快筛的数量
  themes_file: themes.yaml          # 产业链瓶颈主题（桶 3），由你维护

# ------------------------------------------------------------------ WebUI（stock web，只监听 127.0.0.1）
web:
  port: 8765
  max_jobs: 2                       # 同时运行的后台任务数上限（深度报告另有全局互斥：同一时间只跑一个）
  upload_max_mb: 50                 # 上传文档的大小上限

# ------------------------------------------------------------------ 内置调度器（随 stock web 运行，与系统 crontab 二选一）
# 按北京时间把任务放进队列。cron 为 5 段：分 时 日 月 周（1-5 为工作日，0 或 7 为周日）。
# task 取任务登记表中的名称：run 日常流程（已包含标的追踪）、alert 盘中提醒、target_run 标的追踪、dossier 深度报告……
# args 为开关与公司 id（不填公司表示全部）。也可以在 WebUI「设置 → 日程」里修改。
scheduler:
  enabled: true
  catchup_minutes: 120              # 电脑睡眠等原因错过的时点，醒来后在该窗口内补跑一次
  jobs:
    - {name: 早盘日报, task: run, args: [--push], cron: 30 8 * * 1-5, enabled: true}
    - {name: 收盘日报, task: run, args: [--push], cron: 30 17 * * 1-5, enabled: true}
    - {name: 盘中提醒, task: alert, args: [], cron: '*/20 9-16 * * 1-5', enabled: false}
    # 行情刷新：每 5 分钟取追踪中公司的实时快照（无模型；调度器在 web 进程内直接执行，不产生任务记录；休市的市场自动跳过）。
    # 两条合起来覆盖 A 股 / 港股时段与美股夜盘（夏令时 21:30–04:00，冬令时 22:30–05:00，北京时间；美股凌晨跨到周六）
    - {name: 行情刷新·日间与美股夜盘, task: quotes_refresh, args: [], cron: '*/5 9-16,21-23 * * 1-5', enabled: true}
    - {name: 行情刷新·美股凌晨, task: quotes_refresh, args: [], cron: '*/5 0-5 * * 2-6', enabled: true}
    - {name: 周末深度报告, task: dossier, args: [], cron: 0 20 * * 6, enabled: false}
    - {name: 选股·事件池, task: screen_run, args: [--event-only], cron: 0 18 * * 1-5, enabled: true}
    - {name: 选股·长线池, task: screen_run, args: [--long-only], cron: 0 10 * * 6, enabled: true}
    - {name: 选股·主题 agent, task: screen_themes, args: [], cron: 0 14 1 * *, enabled: false}
    - {name: 模拟基金·日线刷新, task: fund_refresh, args: [], cron: 0 19 * * 1-5, enabled: false}
    - {name: 模拟基金·盘前计划, task: fund_plan, args: [--push], cron: 30 8 * * 1-5, enabled: false}
    - {name: 模拟基金·盘中提醒, task: fund_alert, args: [--push], cron: '*/20 9-16 * * 1-5', enabled: false}
    - {name: 模拟基金·盘后复盘, task: fund_close, args: [--push], cron: 30 17 * * 1-5, enabled: false}
    - {name: 模拟基金·周报, task: fund_weekly, args: [--push], cron: 30 10 * * 6, enabled: false}
notify:
  feishu_webhook_env: FEISHU_WEBHOOK
  feishu_secret_env: FEISHU_SECRET  # 飞书机器人开启"签名校验"时需要
  wecom_webhook_env: WECOM_WEBHOOK
  telegram_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_id: 'YOUR_TELEGRAM_CHAT_ID'
  feishu_app_id_env: FEISHU_APP_ID        # 飞书应用机器人：值在 .env；见 README「飞书应用机器人」
  feishu_app_secret_env: FEISHU_APP_SECRET
  feishu_chat_id: ou_YOUR_OPEN_ID                     # 可选：oc_ 开头；填了定时推送也走应用机器人
  feishu_allowed_users: ['ou_YOUR_OPEN_ID']       # 允许下指令的 open_id 或 user_id；先给机器人发消息，回复里会带上你的 open_id
  alert_min_materiality: 4          # stock alert 推送的最低重要性（1–5）

# ------------------------------------------------------------------ 简报
report:
  lookback_hours: 36                # 简报收录最近多少小时的事件
  min_materiality: 2                # 简报里显示的最低重要性
  max_items_per_company: 12
  triage_batch_size: 10             # 每次送给模型分级的条数（同一时段的转载尽量在同一批，便于模型去重）
  profile_max_doc_chars: 180000     # 生成公司画像时最多送入的字数；年报超出时按关键章节节选
  auto_profile: true                # stock run 时资料有更新就自动重新生成画像
  dossier_stale_days: 30            # 深度报告超过多少天在简报里提示更新
  color_scheme: red_up              # red_up 红涨绿跌 / green_up 绿涨红跌
