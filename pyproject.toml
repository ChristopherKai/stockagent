[project]
name = "stockagent"
version = "0.1.0"
description = "自选股研究系统：公告/新闻监控、LLM 事件分级、技术面快照、每日简报"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "openai>=1.50",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "markdown>=3.6",
    "zhconv>=1.4.3",
]

[project.scripts]
stock = "stockagent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
